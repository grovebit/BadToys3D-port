plugins {
    id "com.android.application"
}

android {
    namespace "com.bt3d.raylib"
    compileSdk 35

    defaultConfig {
        applicationId "com.bt3d.raylib"
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "0.1.0"

        externalNativeBuild {
            cmake {
                arguments "-DBT3D_PLATFORM_ANDROID=ON"
            }
        }

        ndk {
            abiFilters "arm64-v8a"
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }
}
